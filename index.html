<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07071a">
<title>EarnPro Admin</title>
<link rel="stylesheet" href="assets/css/admin.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-wrap{width:100%;max-width:400px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .lic{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,var(--p),var(--pl));display:inline-flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 0 32px var(--pglow);margin-bottom:14px}
.login-logo h1{font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--pu),var(--pl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-logo p{font-size:12px;color:var(--t3);margin-top:4px;letter-spacing:.5px}
.login-card{background:var(--card);border:1px solid var(--br);border-radius:var(--r4);padding:28px 24px}
.login-card h2{font-size:19px;font-weight:800;margin-bottom:4px}
.login-card .sub{font-size:12px;color:var(--t3);margin-bottom:20px}
.security-note{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:var(--r2);padding:10px 13px;font-size:11px;color:var(--red);margin-bottom:16px;display:flex;align-items:center;gap:7px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="lic">🛡️</div>
    <h1>Admin Panel</h1>
    <p>EarnPro Management System</p>
  </div>
  <div class="login-card">
    <h2>Secure Login 🔐</h2>
    <p class="sub">Authorized personnel only</p>
    <div class="security-note">🔒 This panel is private. Unauthorized access is blocked.</div>
    <div class="igroup">
      <label>Admin Email</label>
      <input type="email" id="em" class="ifield" placeholder="admin@earnpro.com" autocomplete="email">
    </div>
    <div class="igroup">
      <label>Password</label>
      <input type="password" id="pw" class="ifield" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-p btn-full" id="loginBtn" style="padding:13px;font-size:14px;margin-top:4px">🛡️ Login as Admin</button>
  </div>
</div>

<script type="module">
import { auth, db } from './assets/firebase/firebase.js';
import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { toast, showLoader, hideLoader } from './assets/js/admin.js';

/* Single-fire: if already logged in as admin → dashboard */
const unsub = onAuthStateChanged(auth, async user => {
  unsub();
  if (!user) return;
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.data()?.role === 'admin') location.replace('dashboard.html');
  } catch {}
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  if (!em || !pw) { toast('Fill all fields', 'err'); return; }

  showLoader();
  try {
    const cred = await signInWithEmailAndPassword(auth, em, pw);
    const snap = await getDoc(doc(db, 'users', cred.user.uid));
    if (snap.data()?.role !== 'admin') {
      hideLoader();
      const { signOut } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
      await signOut(auth);
      toast('Access denied. Not an admin.', 'err');
      return;
    }
    location.replace('dashboard.html');
  } catch (e) {
    hideLoader();
    const m = {
      'auth/invalid-credential': 'Wrong email or password',
      'auth/user-not-found':     'No account found',
      'auth/wrong-password':     'Wrong password',
      'auth/too-many-requests':  'Too many attempts. Wait a moment.'
    };
    toast(m[e.code] || 'Login failed', 'err');
  }
});
</script>
</body>
</html>
